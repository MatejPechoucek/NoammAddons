name: Release

# Fork-only CD: build every variant and publish a GitHub Release with the jars.
# Trigger either way:
#   - Actions tab -> Release -> Run workflow (tag defaults to <mod_version>-fork.<run number>)
#   - git tag 1.3.6-fork.1 && git push fork 1.3.6-fork.1
# Only tags containing "-fork" trigger, so mirrored upstream tags (1.3.5, ...) never do.
on:
  push:
    tags: ["*-fork*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (blank = <mod_version>-fork.<run number>)"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository != 'Noamm9/NoammAddons'
    name: Build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6.2.0
        with:
          java-version: "25"
          distribution: microsoft
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: true

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            version=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
            tag="${version}-fork.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - name: Build legit and cheat variants for every Minecraft version
        run: ./gradlew chiseledBuild --build-cache

      - name: Check all four jars exist
        run: |
          for v in 26.2-legit 26.2-cheat 26.3-legit 26.3-cheat; do
            ls build/libs/*-"$v".jar
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" build/libs/*-legit.jar build/libs/*-cheat.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NoammAddons: $TAG" \
            --generate-notes \
            "${flags[@]}"
